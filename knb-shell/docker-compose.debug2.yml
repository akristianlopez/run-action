version: '3.8'

services:
  app:
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: Dockerfile.dev2
    image: knb-shell:debug
    container_name: knb-shell-debug
    ports:
      - "8080:8080"   # Port de votre application Gin
      - "40000:40000" # Port pour la connexion VS Code -> Delve
    # working_dir: /app
    # volumes:
    #   - .:/app
    environment:
      - PORT=8080
      - SERVICE_NAME=app
      - CONSUL_ADDR=wosa_service_mesh_consul:8500
      # http://consul:8500
      - SERVICE_DOMAIN=wosa.local
      - SERVICE_KIND=swarm
      - CONFIG_PATH=knb/services/shell
      # - GIN_MODE=debug
    networks:
      - public_net

networks:
  public_net:
    driver: overlay
    external: true
    attachable: true
    name: public_net