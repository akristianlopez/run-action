<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="/style.css"> -->
    <title>KBM</title>
    <!-- Tailwind CDN nécessite une connexion internet -->
    <!-- <script src="https://cdn.tailwindcss.com"></script>  -->

</head>
<body>
    <div id="app">
        <div id="loading-screen" class="fixed inset-0 z-[110] flex flex-col items-center justify-center bg-white transition-opacity duration-700 ease-in-out">
            
            <div class="absolute w-64 h-64 bg-indigo-50 rounded-full blur-3xl opacity-50 animate-pulse"></div>

            <div class="relative mb-12 transform transition-all duration-1000 animate-in fade-in zoom-in fill-mode-both">
                <div class="w-48 h-48 flex items-center justify-center animate-bounce bg-white rounded-full overflow-hidden shadow-[0_0_50px_rgba(79,70,229,0.1)] border border-indigo-50/50">
                    <img 
                        src="logo-knb.svg" 
                        alt="Knowledge Bits Microsevice" 
                        class="w-full h-full object-contain brightness-110 contrast-105 transition-transform duration-500 hover:scale-110" 
                    />
                </div>
                
                <div class="absolute -inset-5 border-[2px] border-slate-100 border-t-indigo-400 rounded-full animate-spin"></div>
            </div>

            <div class="text-center relative z-10">
                <h1 class="text-2xl font-black tracking-tight text-slate-800 mb-2 drop-shadow-sm">
                    Knowledge Bits microsevice
                </h1>
                <div class="flex items-center justify-center gap-2 text-slate-400 font-semibold text-xs uppercase tracking-widest">
                    <span id="loading-status">Loading</span>
                    <span class="flex gap-1.5">
                        <span class="w-1.5 h-1.5 bg-indigo-300 rounded-full animate-bounce [animation-delay:-0.3s]"></span>
                        <span class="w-1.5 h-1.5 bg-indigo-300 rounded-full animate-bounce [animation-delay:-0.15s]"></span>
                        <span class="w-1.5 h-1.5 bg-indigo-300 rounded-full animate-bounce"></span>
                    </span>
                </div>
            </div>

            <div class="absolute bottom-16 w-32 h-1 bg-slate-50 rounded-full overflow-hidden border border-slate-100">
                <div class="h-full bg-gradient-to-r from-indigo-300 to-indigo-500 animate-[loading_1.5s_infinite_linear]"></div>
            </div>
        </div>

    </div>

    <!-- Vérifie bien que ce fichier existe dans web/src/main.js -->
    <script type="module" src="/src/main.js"></script>
    
</body>
</html>
