<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNB Shell - Orchestrateur</title>
    <!-- Tailwind CDN nécessite une connexion internet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Empêcher le flash blanc au chargement */
        [v-cloak] { display: none; }
        body { background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div id="app">
        <header class="bg-indigo-700 text-white p-4 shadow-lg flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-indigo-700 font-bold">K</div>
                <h1 class="text-xl font-bold tracking-tight">KNB Cloud System</h1>
            </div>
            <nav id="menu" class="flex gap-2"></nav>
        </header>

        <main id="container" class="max-w-7xl mx-auto p-6">
            <div id="welcome" class="bg-white p-12 rounded-2xl shadow-sm border border-gray-200 text-center">
                <h2 class="text-3xl font-bold text-gray-800 mb-4">Console d'Orchestration</h2>
                <p class="text-gray-600 max-w-md mx-auto">
                    Le Shell est prêt. Il attend la découverte de micro-services via Consul pour peupler le menu.
                </p>
            </div>
            <div id="mfe-viewport" class="mt-4"></div>
        </main>
    </div>

    <!-- Vérifie bien que ce fichier existe dans web/src/main.js -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
